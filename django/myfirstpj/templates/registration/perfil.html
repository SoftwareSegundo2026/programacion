{% extends 'base.html' %}

{% block title %}Mi perfil{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl rounded-2xl bg-white p-6 shadow-sm">
    <h1 class="text-3xl font-bold text-slate-900">Mi perfil</h1>
    <p class="mt-1 text-slate-500">{{ user.username }} - {{ user.email }}</p>

    <form method="post" class="mt-6 space-y-5">
        {% csrf_token %}

        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-slate-700">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
            <p class="mt-1 text-sm text-rose-600">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <div class="flex items-center gap-3 pt-2">
            <button type="submit" class="rounded-full bg-slate-900 px-6 py-3 text-sm font-semibold text-white shadow hover:bg-slate-700">Guardar cambios</button>
            <a href="{% url 'getPosts' %}" class="text-sm font-semibold text-slate-600 hover:text-slate-900">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
