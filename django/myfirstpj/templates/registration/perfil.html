{% extends 'base.html' %}

{% block title %}Mi perfil{% endblock %}

{% block content %}
<div class="perfil-form">
    <div class="section-header">
        <div class="section-header__eyebrow">Cuenta</div>
        <h1 class="section-title">Mi perfil</h1>
        <p class="section-subtitle">{{ user.username }} - {{ user.email }}</p>
    </div>

    <div class="perfil-form__card">
        <div class="perfil-form__body">
            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}" class="form-label {% if field.field.required %}form-label--required{% endif %}">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                    <p class="form-error">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    <a href="{% url 'getPosts' %}" class="btn btn-ghost">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
