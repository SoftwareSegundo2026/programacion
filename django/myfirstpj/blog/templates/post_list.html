{% extends 'base.html' %}

{% block title %}Mi Blog{% endblock %}

{% block content %}
    <div class="mb-6 flex flex-col gap-4 rounded-2xl bg-white p-6 shadow-sm sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h1 class="text-3xl font-bold text-slate-900">Mi blog</h1>
            <p class="text-slate-500">Listado de posts publicados.</p>
        </div>
        <div class="flex flex-wrap gap-3">
            <a href="{% url 'deletedPosts' %}" class="rounded-full border border-slate-200 bg-slate-50 px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100">Ver eliminados</a>
            <a href="{% url 'createPost' %}" class="rounded-full bg-slate-900 px-5 py-3 text-sm font-semibold text-white shadow hover:bg-slate-700">Crear post</a>
        </div>
    </div>

    <div class="space-y-4">
        {% for post in posts %}
            <article class="rounded-2xl bg-white p-6 shadow-sm">
                <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
                    <div>
                        <h2 class="text-2xl font-semibold text-slate-900">{{ post.title }}</h2>
                        <p class="mt-3 text-slate-700">{{ post.content }}</p>
                        <p class="mt-4 text-sm text-slate-500">Publicado el {{ post.created_at }}</p>
                    </div>
                    <form action="{% url 'deletePost' post.id %}" method="post" class="shrink-0">
                        {% csrf_token %}
                        <button type="submit" class="rounded-full bg-rose-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-rose-600">Eliminar</button>
                    </form>
                </div>
            </article>
        {% endfor %}
    </div>
{% endblock %}
