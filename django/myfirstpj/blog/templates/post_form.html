{% extends 'base.html' %}

{% block title %}Crear post{% endblock %}

{% block content %}
    <div class="rounded-2xl bg-white p-6 shadow-sm">
        <h1 class="text-3xl font-bold text-slate-900">Crear post</h1>
        {% if error %}
            <p class="mt-4 rounded-lg bg-red-100 px-4 py-3 text-sm text-red-700">{{ error }}</p>
        {% endif %}

        <form method="post" class="mt-6 space-y-5">
            {% csrf_token %}
            <div>
                <label for="title" class="block text-sm font-semibold text-slate-700">Título</label>
                <input id="title" name="title" type="text" value="{{ title|default:'' }}" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200" />
            </div>
            <div>
                <label for="content" class="block text-sm font-semibold text-slate-700">Contenido</label>
                <textarea id="content" name="content" rows="6" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200">{{ content|default:'' }}</textarea>
            </div>
            <div class="flex items-center gap-3">
                <button type="submit" class="rounded-full bg-slate-900 px-6 py-3 text-sm font-semibold text-white shadow hover:bg-slate-700">Guardar</button>
                <a href="{% url 'getPosts' %}" class="text-sm font-semibold text-slate-600 hover:text-slate-900">Volver al listado</a>
            </div>
        </form>
    </div>
{% endblock %}
