<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Blog{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <header class="bg-slate-900 text-white shadow-sm">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between px-4 py-4">
            <div class="text-lg font-semibold">Mi Blog</div>
            <nav class="space-x-4 text-sm">
                <a href="{% url 'getPosts' %}" class="text-slate-100 hover:text-white">Inicio</a>
                <a href="{% url 'createPost' %}" class="text-slate-100 hover:text-white">Crear post</a>
                <a href="{% url 'deletedPosts' %}" class="text-slate-100 hover:text-white">Eliminados</a>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
